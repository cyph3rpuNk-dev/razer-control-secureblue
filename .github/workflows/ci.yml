name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install libdbus (ksni tray), GTK4/libadwaita (desktop app), libudev (hidapi)
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev \
            libgtk-4-dev libadwaita-1-dev libudev-dev
      - name: Unit tests
        run: cargo test --locked --workspace
      - name: Unit tests with the hidraw backend compiled in
        run: cargo test --locked -p razer-control-secureblue --features hidraw-backend
      - name: Formatting
        run: cargo fmt --all --check

  rpm:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install build tooling
        run: |
          dnf install -y git rpm-build rpmdevtools 'dnf-command(builddep)'
      - uses: actions/checkout@v5
      - name: Install spec build dependencies
        run: dnf builddep -y packaging/razer-control-secureblue.spec
      - name: Build source tarball
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p ~/rpmbuild/SOURCES
          git archive --format=tar.gz \
            --prefix=razer-control-secureblue-0.1.0/ \
            -o ~/rpmbuild/SOURCES/razer-control-secureblue-0.1.0.tar.gz HEAD
      - name: Build RPM
        run: rpmbuild -ba packaging/razer-control-secureblue.spec
      - name: Install RPM and verify the Atomic-relevant layout
        run: |
          dnf install -y ~/rpmbuild/RPMS/*/razer-control-secureblue-*.rpm
          test -x /usr/bin/razer-control
          test -f /usr/lib/udev/rules.d/70-razer-control-secureblue.rules
          test -f /usr/lib/systemd/user/razer-control.socket
          test -f /usr/lib/systemd/user/razer-control.service
          if grep -v '^#' /usr/lib/udev/rules.d/70-razer-control-secureblue.rules | grep -q '0666'; then
            echo 'world-writable udev rule detected'; exit 1
          fi
          grep -v '^#' /usr/lib/udev/rules.d/70-razer-control-secureblue.rules | grep -q 'uaccess'
          test -x /usr/bin/razer-control-desktop
          test -x /usr/bin/razer-control-tray
          test -f /usr/share/applications/dev.cyph3rpunk.razer-control.desktop
          test -f /usr/share/icons/hicolor/scalable/apps/razer-control-desktop.svg
          # The desktop entry must point at the binary the RPM actually ships.
          grep -q '^Exec=razer-control-desktop$' /usr/share/applications/dev.cyph3rpunk.razer-control.desktop
          /usr/bin/razer-control device 1532 029d
          /usr/bin/razer-control validate fan manual 3000
          ! /usr/bin/razer-control validate gpu-tdp 140
