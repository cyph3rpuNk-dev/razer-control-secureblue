[workspace]
members = ["tray", "desktop"]

[package]
name = "razer-control-secureblue"
version = "0.1.0"
edition = "2024"
description = "Safety-first Razer Blade control foundations for Atomic Linux"
license = "GPL-2.0-only"

[lib]
name = "razer_control_secureblue"
path = "src/lib.rs"

[[bin]]
name = "razer-control"
path = "src/main.rs"

[target.'cfg(unix)'.dependencies]
listenfd = "1"
signal-hook = "0.3"

[lints.rust]
unsafe_code = "forbid"
