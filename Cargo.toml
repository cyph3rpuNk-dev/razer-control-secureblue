[workspace]
members = ["tray", "desktop"]
# The Tauri shell is benched: WebKitGTK is a poor fit for secureblue's hardened
# runtime (bwrap sandbox + hardened_malloc). Replaced by the native GTK4 crate
# in desktop/. Files kept for reference until the GTK app is verified on-device.
exclude = ["webui/src-tauri"]

[package]
name = "razer-control-secureblue"
version = "0.1.0"
edition = "2024"
description = "Safety-first Razer Blade control foundations for Atomic Linux"
license = "GPL-2.0-only"

[lib]
name = "razer_control_secureblue"
path = "src/lib.rs"

[[bin]]
name = "razer-control"
path = "src/main.rs"

[target.'cfg(unix)'.dependencies]
listenfd = "1"
signal-hook = "0.3"

[lints.rust]
unsafe_code = "forbid"
