[workspace]
members = ["tray", "desktop"]

[package]
name = "razer-control-secureblue"
version = "0.1.0"
edition = "2024"
description = "Safety-first Razer Blade control foundations for Atomic Linux"
license = "GPL-2.0-only"

[lib]
name = "razer_control_secureblue"
path = "src/lib.rs"

[[bin]]
name = "razer-control"
path = "src/main.rs"

[features]
# Compiles the real hidraw backend.  Even with the feature on, the daemon
# only touches hardware when started with the explicit `--backend hidraw`
# runtime flag; dry-run stays the default.
hidraw-backend = ["dep:hidapi"]

# hidapi is cross-platform, so the backend type-checks on the Windows dev
# host too; only the daemon transport is unix-gated.
[dependencies]
hidapi = { version = "2", optional = true }

# Unix-only daemon transport deps:
#   listenfd    - accept the systemd socket-activation fd (LISTEN_FDS).
#   signal-hook - async-signal-safe SIGTERM/SIGINT flag driving the
#                 manual-fan -> auto failsafe on shutdown.
[target.'cfg(unix)'.dependencies]
listenfd = "1"
signal-hook = "0.3"

[lints.rust]
unsafe_code = "forbid"
