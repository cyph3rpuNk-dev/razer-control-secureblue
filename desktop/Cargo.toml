[package]
name = "razer-control-desktop"
version = "0.1.0"
description = "GTK4/libadwaita desktop app for razer-control-secureblue; a thin client over the daemon socket"
license = "GPL-2.0-only"
edition = "2024"

[[bin]]
name = "razer-control-desktop"
path = "src/main.rs"

[dependencies]
razer-control-secureblue = { path = ".." }
starship-battery = "0.10"

# GTK4 + libadwaita are Linux-only. Gating the deps by target keeps the crate
# building as a stub on the maintainer's Windows box (mirroring the tray), so a
# workspace build there still succeeds; the real UI is developed on Linux.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = { package = "gtk4", version = "0.9" }
# v1_4 pulls in ToolbarView + SwitchRow (and the v1_1 header-suffix API).
# Ubuntu 24.04 ships libadwaita 1.5 and Fedora 44 ships 1.7, so this builds
# on both CI runners.
adw = { package = "libadwaita", version = "0.7", features = ["v1_4"] }

[lints.rust]
unsafe_code = "forbid"
